<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Color de Fondo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s ease; /* Hace que el cambio de color sea suave */
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #607d8b;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #455a64; /* El botón se oscurece cuando el mouse pasa encima */
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div>Seleccione Un Color</div>
        <!-- Al hacer clic, ejecuta la función pintar() que está en script.js -->
        <button onclick="pintar()">Cambiar Color</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
