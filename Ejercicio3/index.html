<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Círculo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .interfaz {
            background: white;
            padding: 30px;
            border-radius: 10px; /* Bordes redondeados */
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Sombra suave Xd*/
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="interfaz">
        <h1>Calculadora de Área y Circunferencia de un Círculo</h1>
        <label for="radio">Radio:</label>
        <!-- Campo para ingresar el radio, solo números -->
        <input type="number" id="radio" placeholder="Ingresa el radio">
        <br><br>
        <!-- Botones que ejecutan las funciones al hacer clic -->
        <button onclick="calcularArea()">Calcular Área</button>
        <button onclick="calcularCircunferencia()">Calcular Circunferencia</button>
        <br><br>
        <!-- Contenedores donde se mostrarán los resultados -->
        <div id="area"></div>
        <div id="circunferencia"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
